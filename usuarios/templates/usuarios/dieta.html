<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #f5f5f5;
    }

    .card {
        border-radius: 12px;
    }
</style>
<div class="container mt-5">

    <h2 class="mb-4 text-center">Plano de Dieta</h2>

    
    <div class="card shadow mb-4">
        <div class="card-body text-center">
            <h4 class="card-title">{{ usuario.nome }}</h4>
            <p class="mb-1">Objetivo: <strong>{{ usuario.objetivo }}</strong></p>
            <p class="mb-0">Atividade: <strong>{{ usuario.atividade }}</strong></p>
        </div>
    </div>

   
    <div class="card shadow mb-4 text-center">
        <div class="card-body">
            <h5>Calorias Diárias</h5>
            <h1 class="text-success">{{ calorias }}</h1>
            <p class="text-muted">kcal por dia</p>
        </div>
    </div>

    
    <div class="row text-center">

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h6>Proteína</h6>
                    <h3 class="text-primary">{{ macros.proteina }}g</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h6>Carboidrato</h6>
                    <h3 class="text-warning">{{ macros.carboidrato }}g</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h6>Gordura</h6>
                    <h3 class="text-danger">{{ macros.gordura }}g</h3>
                </div>
            </div>
        </div>

    </div>

</div>
