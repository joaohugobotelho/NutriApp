<!DOCTYPE html>
<html>
<head>
    <title>Dieta</title>
</head>
<body>

    <h1>Plano de Dieta</h1>

    {% if usuario %}
        <p><strong>Nome:</strong> {{ usuario.nome }}</p>
        <p><strong>Peso:</strong> {{ usuario.peso }} kg</p>
        <p><strong>Objetivo:</strong> {{ usuario.objetivo }}</p>

        <h2>Calorias diárias:</h2>
        <p>{{ calorias }} kcal</p>
    {% else %}
        <p>Nenhum usuário cadastrado.</p>
    {% endif %}

</body>
</html>
