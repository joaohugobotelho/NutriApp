<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


    <form method="POST">
        {% csrf_token %}
        <div class="container mt-5">
    <h2 class="mb-4">Cadastro</h2>

    <form method="POST" class="card p-4 shadow">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nome</label>
            <input type="text" name="nome" class="form-control">
        </div>

        <div class="mb-3">
            <label>Idade</label>
            <input type="number" name="idade" class="form-control">
        </div>

        <div class="mb-3">
            <label>Peso (kg)</label>
            <input type="number" step="0.1" name="peso" class="form-control">
        </div>

        <div class="mb-3">
            <label>Altura (cm)</label>
            <input type="number" name="altura" class="form-control">
        </div>

        
        <div class="mb-3">
            <label class="form-label">Objetivo</label><br>

            <input type="radio" class="btn-check" name="objetivo" value="emagrecer" id="obj1">
            <label class="btn btn-outline-danger" for="obj1">Emagrecer</label>

            <input type="radio" class="btn-check" name="objetivo" value="manter" id="obj2">
            <label class="btn btn-outline-secondary" for="obj2">Manter</label>

            <input type="radio" class="btn-check" name="objetivo" value="massa" id="obj3">
            <label class="btn btn-outline-success" for="obj3">Ganhar Massa</label>
        </div>

        
        <div class="mb-3">
            <label class="form-label">Déficit</label><br>

            <input type="radio" class="btn-check" name="tipo_deficit" value="manutencao" id="def1">
            <label class="btn btn-outline-primary" for="def1">Manutenção</label>

            <input type="radio" class="btn-check" name="tipo_deficit" value="leve" id="def2">
            <label class="btn btn-outline-primary" for="def2">Leve</label>

            <input type="radio" class="btn-check" name="tipo_deficit" value="moderado" id="def3">
            <label class="btn btn-outline-primary" for="def3">Moderado</label>

            <input type="radio" class="btn-check" name="tipo_deficit" value="agressivo" id="def4">
            <label class="btn btn-outline-primary" for="def4">Agressivo</label>
        </div>

        
        <div class="mb-3">
            <label class="form-label">Nível de Atividade</label><br>

            <input type="radio" class="btn-check" name="atividade" value="sedentario" id="at1">
            <label class="btn btn-outline-dark" for="at1">Sedentário</label>

            <input type="radio" class="btn-check" name="atividade" value="leve" id="at2">
            <label class="btn btn-outline-dark" for="at2">Leve</label>

            <input type="radio" class="btn-check" name="atividade" value="moderado" id="at3">
            <label class="btn btn-outline-dark" for="at3">Moderado</label>

            <input type="radio" class="btn-check" name="atividade" value="intenso" id="at4">
            <label class="btn btn-outline-dark" for="at4">Intenso</label>
        </div>

        <button type="submit" class="btn btn-success w-100">
            Cadastrar
        </button>
    </form>
</div>
        

        
    </form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
